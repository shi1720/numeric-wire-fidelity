name: Verify recorded evidence
on: [push, pull_request]
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm test
      - run: NODE=node python3 scripts/property_check.py
      - run: NODE=node python3 scripts/run_demo.py
      - run: python3 scripts/verify_results.py
